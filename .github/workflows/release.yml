name: Release

on:
  push:
    tags:
      - 'v*'

# Allow the workflow to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ── Create draft release ───────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-mac-arm64:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (arm64)
        run: npm run build && npx electron-builder --mac --arm64 --publish never

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip

  # ── macOS x64 (Intel) — cross-compiled from Apple Silicon runner ──────────
  build-mac-x64:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (x64)
        run: npm run build && npx electron-builder --mac --x64 --publish never

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip

  # ── Windows x64 + arm64 ───────────────────────────────────────────────────
  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe

  # ── Linux x64 ─────────────────────────────────────────────────────────────
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run build && npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.AppImage
            dist/*.deb
